version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Andorra
    open-pull-requests-limit: 5
    groups:
      compatible-rust-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/Andorra
    open-pull-requests-limit: 5
    groups:
      action-dependencies:
        patterns:
          - "*"
