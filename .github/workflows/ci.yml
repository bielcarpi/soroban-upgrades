name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned 2026-08-05
        with:
          toolchain: 1.93.0
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: stellar/stellar-cli@8e402ea28202950b272fbabc34caad4d2f64fe87 # v27.1.0
        with:
          version: 27.1.0
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-audit@0.22.2
      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_x86_64.tar.gz"
          checksums="actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${checksums}" \
            --output "$RUNNER_TEMP/$checksums"
          (cd "$RUNNER_TEMP" && grep " ${archive}$" "$checksums" | sha256sum --check)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$CARGO_HOME/bin" actionlint
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.9.2
      - name: Verify release behavior and evidence
        run: ./scripts/verify-release.sh

  platform-tests:
    name: ${{ matrix.name }} tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
          - name: macOS ARM64
            runner: macos-latest
          - name: Windows x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.9.2
      - name: Test the library and CLI
        run: cargo test --locked --package soroban-upgrades-core --package soroban-upgrades-cli
      - name: Build the release binary
        run: cargo build --locked --release --package soroban-upgrades-cli
