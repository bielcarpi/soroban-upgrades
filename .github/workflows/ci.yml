name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned 2026-08-05
        with:
          toolchain: 1.93.0
          targets: wasm32v1-none
          components: rustfmt, clippy, llvm-tools-preview
      - uses: stellar/stellar-cli@300aaf69ab100536678bdb641428b06f06b318ea # v28.0.0
        with:
          version: 28.0.0
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-llvm-cov@0.9.0,cargo-semver-checks@0.50.0
      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          checksums="actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${checksums}" \
            --output "$RUNNER_TEMP/$checksums"
          (cd "$RUNNER_TEMP" && grep " ${archive}$" "$checksums" | sha256sum --check)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$CARGO_HOME/bin" actionlint
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Verify release behavior and evidence
        run: ./scripts/verify-release.sh

  platform-tests:
    name: ${{ matrix.name }} tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
          - name: macOS ARM64
            runner: macos-latest
          - name: Windows x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test the library and CLI
        run: cargo test --locked --package soroban-upgrades-core --package soroban-upgrades-cli
      - name: Build the release binary
        run: cargo build --locked --release --package soroban-upgrades-cli
