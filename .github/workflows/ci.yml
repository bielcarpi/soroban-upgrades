name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, pinned 2026-08-05
        with:
          toolchain: 1.93.0
          targets: wasm32v1-none
          components: rustfmt, clippy, llvm-tools-preview
      - uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
        with:
          version: 28.0.0
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-llvm-cov@0.9.0,cargo-semver-checks@0.50.0
      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          checksums="actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${checksums}" \
            --output "$RUNNER_TEMP/$checksums"
          (cd "$RUNNER_TEMP" && grep " ${archive}$" "$checksums" | sha256sum --check)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$CARGO_HOME/bin" actionlint
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Verify release behavior and evidence
        run: ./scripts/verify-release.sh

  platform-tests:
    name: ${{ matrix.name }} tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
          - name: macOS ARM64
            runner: macos-latest
          - name: Windows x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test the library and CLI
        run: cargo test --locked --package soroban-upgrades-core --package soroban-upgrades-cli
      - name: Build the release binary
        run: cargo build --locked --release --package soroban-upgrades-cli
